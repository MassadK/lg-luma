name: Liquid Glass standalone build
on:
  push:
    branches: [liquid-glass]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: armv7-unknown-linux-gnueabi
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev pkg-config woff2 python3-fonttools xvfb libgl1-mesa-dri
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: pnpm test
      - run: pnpm assets
      - run: cargo build --locked
      - run: xvfb-run -a pnpm test:glass
      - run: pnpm sdk
      - run: pnpm build && node tools/package.mjs
        env:
          WEBOS_NDK: ${{ github.workspace }}/.build/toolchain/arm-webos-linux-gnueabi_sdk-buildroot
      - uses: actions/upload-artifact@v6
        with:
          name: Luma-Liquid-Glass-0.1.0-standalone
          path: |
            dist/*.ipk
            dist/sha256sums
          retention-days: 30
